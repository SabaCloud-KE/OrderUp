services:
  # ─── Express API Server ───────────────────────────────────────────────────
  - type: web
    name: orderup-server
    runtime: node
    region: oregon
    plan: starter
    branch: main
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:server
    startCommand: npx prisma db push --schema=apps/server/prisma/schema.prisma --accept-data-loss && node apps/server/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RESEND_API_KEY
        sync: false

  # ─── React Client (Static Site) ───────────────────────────────────────────
  - type: web
    name: orderup-client
    runtime: static
    branch: main
    rootDir: apps/client
    buildCommand: cd ../.. && npm install && npm run build:client
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
