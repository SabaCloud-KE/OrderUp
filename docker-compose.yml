version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderup-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderup_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderup_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-orderup_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderup_user} -d ${POSTGRES_DB:-orderup_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: orderup-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-orderup_user}:${POSTGRES_PASSWORD:-orderup_pass_2026}@postgres:5432/${POSTGRES_DB:-orderup_db}?schema=public
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: orderup-client
    restart: always
    ports:
      - "8080:80"

  nginx:
    image: nginx:alpine
    container_name: orderup-nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - server
      - client

volumes:
  pgdata:
