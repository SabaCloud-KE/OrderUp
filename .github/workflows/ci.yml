name: OrderUp Kenya CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orderup_test?sslmode=disable
        run: npx prisma generate --schema=apps/server/prisma/schema.prisma

      - name: Run TypeScript Type Check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orderup_test?sslmode=disable
        run: npm run type-check --if-present

  unit-and-integration-tests:
    name: Vitest Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orderup_test?sslmode=disable
        run: npx prisma generate --schema=apps/server/prisma/schema.prisma

      - name: Execute Vitest Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orderup_test?sslmode=disable
          JWT_ACCESS_SECRET: ci_test_access_secret_32_bytes_long_key
          JWT_REFRESH_SECRET: ci_test_refresh_secret_32_bytes_long_key
        run: npm run test --workspace=apps/server --if-present

  e2e-playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    # Full ordering tests need a live backend — smoke tests always run.
    # The job itself won't block merging since the live-backend flow is skipped in CI.
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Build UI Package
        run: npm run build --workspace=packages/ui

      - name: Build Customer PWA
        run: npm run build --workspace=apps/customer-pwa

      - name: Build Staff Portal
        run: npm run build --workspace=apps/staff-portal

      - name: Build Admin Portal
        run: npm run build --workspace=apps/admin-portal

      - name: Build Client App
        run: npm run build --workspace=apps/client

      - name: Install Playwright Browsers (Chromium only)
        run: npx playwright install chromium --with-deps
        working-directory: apps/client

      - name: Run Playwright Tests
        env:
          CI: true
        run: npx playwright test
        working-directory: apps/client

  docker-build-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: false
          tags: orderup-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/client/Dockerfile
          push: false
          tags: orderup-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
