version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderup_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderup_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Secr3tP@ssw0rd!}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orderup_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-Secr3tRedis!}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: orderup_server_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Secr3tP@ssw0rd!}@postgres:5432/${POSTGRES_DB:-orderup_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-Secr3tRedis!}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-prod_jwt_secret_key_orderup_kenya_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_jwt_refresh_secret_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: orderup_client_prod
    restart: always
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: orderup_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
      - client

volumes:
  postgres_prod_data:
